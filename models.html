<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bench Labs — Models</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
  <link rel="stylesheet" href="static/ui.css">
</head>
<body class="bg-[#171717] text-zinc-100 antialiased min-h-screen flex flex-col">

  <!-- Main container -->
  <main class="flex-grow py-16 md:py-24 max-w-5xl mx-auto px-6 md:px-8 w-full">
    <div class="text-center max-w-2xl mx-auto mb-12">
      <h1 class="text-4xl font-bold tracking-tight text-zinc-100 md:text-5xl">Our Models</h1>
      <p class="mt-4 text-base md:text-lg text-zinc-400">
        Browse and discover our collections of open weights, tiny, and exceptionally efficient generative models.
      </p>
    </div>

    <!-- Interactive Explorer Section -->
    <div class="mb-10 flex flex-col md:flex-row gap-4 items-center justify-between border-b border-zinc-800 pb-6">
      <!-- Tag Filters -->
      <div class="flex flex-wrap gap-2" id="tag-filters">
        <button data-filter="all" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-zinc-100 text-zinc-900 border border-transparent cursor-pointer transition-colors hover:bg-zinc-200">
          All
        </button>
        <button data-filter="t2i" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-zinc-800 text-zinc-300 border border-zinc-700/50 cursor-pointer transition-colors hover:bg-zinc-700">
          Text-to-Image
        </button>
        <button data-filter="t23d" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-zinc-800 text-zinc-300 border border-zinc-700/50 cursor-pointer transition-colors hover:bg-zinc-700">
          Text-to-3D
        </button>
        <button data-filter="lm" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-zinc-800 text-zinc-300 border border-zinc-700/50 cursor-pointer transition-colors hover:bg-zinc-700">
          Language Models
        </button>
      </div>

      <!-- Partner Filters -->
      <div class="flex items-center gap-2">
        <span class="text-xs text-zinc-500 font-medium">Author:</span>
        <select id="author-select" class="bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-zinc-700">
          <option value="all">All Authors</option>
          <option value="bench-labs">Bench Labs</option>
          <option value="fromziro">FromZero</option>
          <option value="FlameF0X">FlameF0X (FWKV)</option>
        </select>
      </div>
    </div>

    <!-- Models Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="models-explorer-grid">
      <!-- Cards dynamically rendered / filtered below -->
    </div>
  </main>

  <!-- Navigation JS -->
  <script src="static/navigation.js"></script>

  <!-- Models list & Filter code -->
  <script>
    const modelsData = [
      {
        id: "bench-labs/PixelModel-v6",
        name: "PixelModel v6",
        description: "Multi-modal diffusion transformer model.",
        type: "t2i",
        author: "bench-labs",
        coauthor: "AtomixLabs",
        params: "0.2B",
        link: "https://huggingface.co/bench-labs/PixelModel-v6"
      },
      {
        id: "bench-labs/PixelModel-v5",
        name: "PixelModel v5",
        description: "Rectified-flow diffusion transformer system.",
        type: "t2i",
        author: "bench-labs",
        coauthor: "FWKV",
        params: "0.2B",
        link: "https://huggingface.co/bench-labs/PixelModel-v5"
      },
      {
        id: "bench-labs/VoxelModel-v1",
        name: "VoxelModel-v1",
        description: "Lightweight 3D scene generator.",
        type: "t23d",
        author: "bench-labs",
        coauthor: "İvmeLabs",
        params: "40.2M",
        link: "https://huggingface.co/bench-labs/VoxelModel-v1"
      },
      {
        id: "fromziro/Er-Tiny-1.3M",
        name: "Er-Tiny 1.3M",
        description: "Stupidly small Qwen3.5 language model.",
        type: "lm",
        author: "fromziro",
        coauthor: "Bench Labs",
        params: "1.3M",
        link: "https://huggingface.co/fromziro/Er-Tiny-1.3M"
      },
      {
        id: "FlameF0X/FWKV-29M",
        name: "FWKV 29M",
        description: "Novel efficient recurrent language model.",
        type: "lm",
        author: "FlameF0X",
        coauthor: "Bench Labs",
        params: "29M",
        link: "https://huggingface.co/FlameF0X/FWKV-29M"
      }
    ];

    const grid = document.getElementById('models-explorer-grid');
    const authorSelect = document.getElementById('author-select');
    const tagButtons = document.querySelectorAll('#tag-filters button');

    let activeTag = 'all';
    let activeAuthor = 'all';

    function render() {
      const filtered = modelsData.filter(m => {
        const matchesTag = activeTag === 'all' || m.type === activeTag;
        const matchesAuthor = activeAuthor === 'all' || m.author === activeAuthor;
        return matchesTag && matchesAuthor;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center">
            <p class="text-sm text-zinc-500">No models match the selected filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(model => `
        <div class="ui-card group relative flex flex-col justify-between rounded-2xl border border-zinc-800 p-6 transition-all duration-300">
          <div>
            <div class="flex items-start justify-between gap-2 mb-3">
              <div>
                <h3 class="text-lg font-bold text-zinc-100 group-hover:text-white">${model.name}</h3>
                <span class="text-[10px] text-zinc-500 font-medium">By ${model.author}</span>
              </div>
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 border border-zinc-700/50">${model.params}</span>
            </div>
            <p class="text-xs text-zinc-400 mb-6 leading-relaxed">
              ${model.description}
            </p>
          </div>
          <div class="flex flex-col gap-3 mt-auto">
            <div class="flex items-center justify-between border-t border-zinc-800/50 pt-3">
              <span class="text-[10px] text-zinc-500">Co-author: <span class="text-zinc-400 font-semibold">${model.coauthor}</span></span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-zinc-900 text-zinc-400 border border-zinc-800 uppercase font-bold tracking-wider">${model.type}</span>
            </div>
            <a href="${model.link}" target="_blank" rel="noopener" class="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-zinc-300 group-hover:text-white">
              Explore Model
              <span class="text-zinc-500 group-hover:translate-x-1 transition-transform">→</span>
            </a>
          </div>
        </div>
      `).join('');
    }

    // Tag button click events
    tagButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tagButtons.forEach(b => {
          b.classList.remove('bg-zinc-100', 'text-zinc-900');
          b.classList.add('bg-zinc-800', 'text-zinc-300', 'border-zinc-700/50');
        });
        btn.classList.add('bg-zinc-100', 'text-zinc-900');
        btn.classList.remove('bg-zinc-800', 'text-zinc-300', 'border-zinc-700/50');
        activeTag = btn.getAttribute('data-filter');
        render();
      });
    });

    // Author selection change event
    authorSelect.addEventListener('change', (e) => {
      activeAuthor = e.target.value;
      render();
    });

    // Initial render
    render();
  </script>
</body>
</html>
